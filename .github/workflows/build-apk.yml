name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project and add the Vires code
        run: |
          unzip -q vires_update.zip
          flutter create --platforms=android --project-name gym_log --org com.vires app
          rm -rf app/lib app/assets
          cp -r lib app/lib
          cp -r assets app/assets
          cp flutter_launcher_icons.yaml app/
          cd app
          flutter pub add table_calendar shared_preferences fl_chart flutter_ringtone_player vibration
          flutter pub add --dev flutter_launcher_icons
          sed -i 's/android:label="[^"]*"/android:label="Vires"/' android/app/src/main/AndroidManifest.xml
          dart run flutter_launcher_icons

      - name: Force compileSdk 35 on all plugins
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 35
                      }
                  }
              }
          }
          EOF

      - name: Build the APK
        run: |
          cd app
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Vires-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
