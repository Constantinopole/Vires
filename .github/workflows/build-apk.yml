name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project and add the Vires code
        run: |
          flutter create --platforms=android --project-name gym_log --org com.vires app
          rm -rf app/lib app/assets
          cp -r vires_update/lib app/lib
          cp -r vires_update/assets app/assets
          mkdir -p app/assets/sounds
          if [ -f timer.mp3 ]; then cp timer.mp3 app/assets/sounds/timer.mp3; echo "Custom timer sound added"; fi
          cp -r vires_update/android_overlay/res/. app/android/app/src/main/res/
          cd app
          flutter pub add table_calendar shared_preferences fl_chart flutter_ringtone_player vibration audioplayers
          python3 ../vires_update/tools/android_setup.py .

      - name: Force compileSdk 35 on all plugins
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 35
                      }
                  }
              }
          }
          EOF

      - name: Build the APK
        run: |
          cd app
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Vires-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
